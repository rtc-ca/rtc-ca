<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTC Cost Analysis Dashboard (EA) </title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb}
.card{border:none;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.summary-panel{position:sticky;top:20px}
.table thead{background:#0d6efd;color:#fff}
.readonly{background:#f8fafc!important}
.metric{padding:12px 0;border-bottom:1px solid #eee}
.metric:last-child{border-bottom:none}
.metric-value{font-size:1.4rem;font-weight:700}
@media(max-width:991px){.summary-panel{position:relative}}
</style>
</head>
<body>
<div class="container-fluid py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2 style="color: maroon;">RTC Cost Analysis Dashboard</h2>
<div class="d-flex gap-2">
<input type="number" id="rowCount" class="form-control" placeholder="How many rows?" style="width:180px">
<button class="btn btn-primary" onclick="createRows()">Create Rows</button>
<button class="btn btn-warning" onclick="deleteLastRow()">Delete Last Row</button>
<button class="btn btn-danger" onclick="deleteAllRows()">Delete All Rows</button>
</div>
</div>

<div class="row g-4">
<div class="col-lg-9">
<div class="card"><div class="card-body">
<div class="table-responsive">
<table class="table align-middle">
<thead>
<tr>
<th>Item</th>
<th>Printing</th>
<th>Cost</th>
<th>Mark Up</th>
<th>Selling</th>
<th>Quantity</th>
<th>Total Selling</th>
<th>Total Cost</th>
<th>Profit</th>
<th></th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div></div>
</div>

<div class="col-lg-3">
<div class="card summary-panel">
<div class="card-body">
<h4>Summary</h4>

<div class="metric"><small>Total Quantity</small><div id="totalQty" class="metric-value">0</div></div>
<div class="metric"><small>Total Selling</small><div id="totalSelling" class="metric-value">₱0.00</div></div>
<div class="metric"><small>Total Cost</small><div id="totalCost" class="metric-value">₱0.00</div></div>
<div class="metric"><small>Gross Profit</small><div id="grossProfit" class="metric-value">₱0.00</div></div>
<div class="metric"><small>Gross Margin</small><div id="grossMargin" class="metric-value">0%</div></div>

<div class="metric">
<small>Other Expenses (%)</small>
<input type="number" id="expensePercent" class="form-control mt-2" value="0" oninput="calculate()">
</div>

<div class="metric"><small>Other Expenses Amount</small><div id="expenseAmount" class="metric-value">₱0.00</div></div>
<div class="metric"><small>Net Profit</small><div id="netProfit" class="metric-value">₱0.00</div></div>
<div class="metric"><small>Net Margin</small><div id="netMargin" class="metric-value">0%</div></div>

</div>
</div>
</div>
</div>
</div>

<script>
function peso(v){return Number(v).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});}

function addRow(){
document.getElementById('tableBody').insertAdjacentHTML('beforeend',`
<tr>
<td><input type="number" class="form-control item" oninput="calculate()"></td>
<td><input type="number" class="form-control printing" oninput="calculate()"></td>
<td><input type="text" class="form-control readonly cost" readonly></td>
<td><input type="text" class="form-control readonly markup" readonly></td>
<td><input type="number" class="form-control selling" oninput="calculate()"></td>
<td><input type="number" class="form-control qty" value="0" oninput="calculate()"></td>
<td><input type="text" class="form-control readonly totalSelling" readonly></td>
<td><input type="text" class="form-control readonly totalCost" readonly></td>
<td><input type="text" class="form-control readonly profit" readonly></td>
<td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove();calculate();">×</button></td>
</tr>`);
}

function createRows(){
let c=parseInt(document.getElementById('rowCount').value)||0;
for(let i=0;i<c;i++) addRow();
document.getElementById('rowCount').value='';
}

function deleteLastRow(){
let rows=document.querySelectorAll('#tableBody tr');
if(rows.length) rows[rows.length-1].remove();
calculate();
}

function deleteAllRows(){
document.getElementById('tableBody').innerHTML='';
calculate();
}

function calculate(){
let totalQty=0,totalSelling=0,totalCost=0,totalProfit=0;

document.querySelectorAll('#tableBody tr').forEach(row=>{
let item=parseFloat(row.querySelector('.item').value);
let printing=parseFloat(row.querySelector('.printing').value);
let selling=parseFloat(row.querySelector('.selling').value)||0;
let qty=parseFloat(row.querySelector('.qty').value)||0;

let hasItem=!isNaN(item);
let hasPrinting=!isNaN(printing);

let cost=null;

if(hasItem||hasPrinting){
cost=(hasItem?item:0)+(hasPrinting?printing:0);
row.querySelector('.cost').value=peso(cost);
row.querySelector('.markup').value=peso(cost*1.4);
}else{
row.querySelector('.cost').value='';
row.querySelector('.markup').value='';
}

let rowSelling=selling*qty;
row.querySelector('.totalSelling').value=peso(rowSelling);

let rowCost=null;
if(cost!==null){
rowCost=cost*qty;
row.querySelector('.totalCost').value=peso(rowCost);
}else{
row.querySelector('.totalCost').value='';
}

let profit=(rowCost!==null)?(rowSelling-rowCost):rowSelling;
row.querySelector('.profit').value=peso(profit);

totalQty+=qty;
totalSelling+=rowSelling;
if(rowCost!==null) totalCost+=rowCost;
totalProfit+=profit;
});

document.getElementById('totalQty').innerText=totalQty;
document.getElementById('totalSelling').innerText='₱'+peso(totalSelling);
document.getElementById('totalCost').innerText='₱'+peso(totalCost);
document.getElementById('grossProfit').innerText='₱'+peso(totalProfit);

let gm=totalSelling?((totalProfit/totalSelling)*100):0;
document.getElementById('grossMargin').innerText=gm.toFixed(2)+'%';

let ep=parseFloat(document.getElementById('expensePercent').value)||0;
let ea=totalSelling*(ep/100);
let np=totalProfit-ea;
let nm=totalSelling?((np/totalSelling)*100):0;

document.getElementById('expenseAmount').innerText='₱'+peso(ea);
document.getElementById('netProfit').innerText='₱'+peso(np);
document.getElementById('netMargin').innerText=nm.toFixed(2)+'%';
}
</script>
</body>
</html>
